  <text x="474" y="382" fill="#696773" font-family="Departure Mono, ui-monospace, monospace" font-size="18" letter-spacing="2">PRIVATE STRATEGY / PUBLIC RESULTS / VERIFIED RECEIPTS</text>
</svg>
