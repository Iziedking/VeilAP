<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title description">
  <title id="title">Veil Arena X header</title>
  <desc id="description">Veil Arena tournament identity with the VA Drop, public results, and sealed strategy message.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#b9b7c1" stroke-width="1" opacity=".34"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="#e8e9ed"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <path d="M0 0h20v500H0z" fill="#19181f"/>
  <g transform="translate(84 136) scale(8)">
    <path d="M3 4h6v10H3zM7 10h6v10H7zM15 12h6v10h-6zM19 8h6v10h-6zM23 4h14v6H23zM31 8h6v18h-6zM19 12h18v6H19z" fill="#19181f"/>
    <path d="M11 16h6v10h-6z" fill="#f2a572"/>
  </g>
