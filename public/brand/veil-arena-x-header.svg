  <text x="474" y="278" fill="#19181f" font-family="Departure Mono, ui-monospace, monospace" font-size="25" letter-spacing="2">BUILD YOUR AGENT. NEVER SHOW YOUR HAND.</text>
  <path d="M474 330h730" stroke="#19181f" stroke-width="3"/>
