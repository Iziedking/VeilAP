name: Verify and deploy Veil Arena

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-arena-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://veil_arena_ci:veil_arena_ci@127.0.0.1:5432/veil_promise_audit
      DATABASE_URL: postgresql://veil_arena_ci:veil_arena_ci@127.0.0.1:5432/veil_promise_audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veil_promise_audit
          POSTGRES_USER: veil_arena_ci
          POSTGRES_PASSWORD: veil_arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veil_arena_ci -d veil_promise_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove database migrations are repeat-safe
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Run checks including real PostgreSQL
        run: npm run check

      - name: Recheck promise invariants and worker process recovery
        run: |
          npm run test:promises
          npm run test:worker-runtime

      - name: Build application
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

  deploy:
    name: Deploy backend VM
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VEIL_VM_HOST: ${{ secrets.VEIL_VM_HOST }}
      VEIL_VM_USER: ${{ secrets.VEIL_VM_USER }}
      VEIL_VM_SSH_KEY: ${{ secrets.VEIL_VM_SSH_KEY }}
      VEIL_VM_KNOWN_HOSTS: ${{ secrets.VEIL_VM_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VEIL_VM_HOST"
          test -n "$VEIL_VM_USER"
          test -n "$VEIL_VM_SSH_KEY"
          test -n "$VEIL_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VEIL_VM_SSH_KEY" > "$HOME/.ssh/veil-vm"
          chmod 600 "$HOME/.ssh/veil-vm"
          printf '%s\n' "$VEIL_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Package release
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.env --exclude=.env.* --exclude=deploy/veil-arena.env --exclude=playwright-report --exclude=test-results --exclude=ui-artifacts -czf "$RUNNER_TEMP/veil-arena-${RELEASE_SHA}.tgz" .

      - name: Copy release to VM
        run: scp -i "$HOME/.ssh/veil-vm" -o IdentitiesOnly=yes "$RUNNER_TEMP/veil-arena-${RELEASE_SHA}.tgz" "$VEIL_VM_USER@$VEIL_VM_HOST:/tmp/veil-arena-${RELEASE_SHA}.tgz"

      - name: Activate release on VM
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/veil-vm" -o IdentitiesOnly=yes "$VEIL_VM_USER@$VEIL_VM_HOST" "RELEASE_SHA=$RELEASE_SHA bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="/opt/veil-arena/releases/${RELEASE_SHA}"
          mkdir -p "$release_dir" /opt/veil-arena/releases /opt/veil-arena/config
          tar -xzf "/tmp/veil-arena-${RELEASE_SHA}.tgz" -C "$release_dir"
          rm -f "/tmp/veil-arena-${RELEASE_SHA}.tgz"
          VEIL_ARENA_RELEASE_DIR="$release_dir" bash "$release_dir/scripts/deploy-vm.sh"
          REMOTE
