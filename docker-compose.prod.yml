name: veil-arena

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - veil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  migrate:
    image: ${VEIL_ARENA_IMAGE:-veil-arena:local}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - private

  app:
    image: ${VEIL_ARENA_IMAGE:-veil-arena:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STARKNET_CHAIN_ID: ${NEXT_PUBLIC_STARKNET_CHAIN_ID}
        NEXT_PUBLIC_STRK20_POOL_ADDRESS: ${NEXT_PUBLIC_STRK20_POOL_ADDRESS}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      STARKNET_RPC_URL: ${STARKNET_RPC_URL}
      VEILAP_APP_ORIGIN: ${VEILAP_APP_ORIGIN}
      VEILAP_SESSION_SECRET: ${VEILAP_SESSION_SECRET}
      VEILAP_WALLET_HASH_PEPPER: ${VEILAP_WALLET_HASH_PEPPER}
      VEILAP_KMS_KEY_ID: ${VEILAP_KMS_KEY_ID}
      AWS_REGION: ${AWS_REGION}
      VEILAP_RECEIPT_SIGNING_PRIVATE_KEY: ${VEILAP_RECEIPT_SIGNING_PRIVATE_KEY}
      VEILAP_RECEIPT_SIGNING_PUBLIC_KEY: ${VEILAP_RECEIPT_SIGNING_PUBLIC_KEY}
      VEILAP_ARENA_WORKER_SECRET: ${VEILAP_ARENA_WORKER_SECRET}
      VEILAP_ARENA_WORKER_WALLET_ADDRESS: ${VEILAP_ARENA_WORKER_WALLET_ADDRESS}
      NEXT_PUBLIC_STARKNET_CHAIN_ID: ${NEXT_PUBLIC_STARKNET_CHAIN_ID}
      NEXT_PUBLIC_STRK20_POOL_ADDRESS: ${NEXT_PUBLIC_STRK20_POOL_ADDRESS}
      NEXT_PUBLIC_VEILAP_PREVIEW_MODE: ${NEXT_PUBLIC_VEILAP_PREVIEW_MODE}
      VEILAP_PREVIEW_AUTH: ${VEILAP_PREVIEW_AUTH}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      VEIL_API_DOMAIN: ${VEIL_API_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - veil_caddy_data:/data
      - veil_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - private

volumes:
  veil_postgres_data:
  veil_caddy_data:
  veil_caddy_config:

networks:
  private:
    driver: bridge
